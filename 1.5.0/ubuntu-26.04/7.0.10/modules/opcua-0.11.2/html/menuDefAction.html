<h1 id="Menu-menuDefAction">Menu menuDefAction  <a class='sect' href="#Menu-menuDefAction">&sect;</a></h1>

<p>This menu defines the default action for an (opcuaItem) record that can read or write an OPC UA item.</p>

<blockquote><table border="1"><tr>
<th>Index</th><th>Identifier</th><th>Choice String</th></tr>
<tr>
<td class='cell DBD_Menu index'>0</td>
<td class='cell DBD_Menu identifier'>menuDefActionREAD</td>
<td class='cell DBD_Menu choice'>read</td>
</tr>
<tr>
<td class='cell DBD_Menu index'>1</td>
<td class='cell DBD_Menu identifier'>menuDefActionWRITE</td>
<td class='cell DBD_Menu choice'>write</td>
</tr>
</table></blockquote>
